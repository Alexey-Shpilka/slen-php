version: 2
updates:
  # The actions are pinned by commit; Dependabot moves the pin and its comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'], update-types: [minor, patch] }
  # Only the dev dependencies and the ranges of composer.json: there is no lock file to update.
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    versioning-strategy: increase-if-necessary
    # A major of an optional client moves the range the help slice and the console's
    # installation article name, and one of phpunit the suite: work of an iteration.
    ignore:
      - { dependency-name: guzzlehttp/guzzle, update-types: ['version-update:semver-major'] }
      - { dependency-name: symfony/http-client, update-types: ['version-update:semver-major'] }
      - { dependency-name: nyholm/psr7, update-types: ['version-update:semver-major'] }
      - { dependency-name: 'illuminate/*', update-types: ['version-update:semver-major'] }
      - { dependency-name: phpunit/phpunit, update-types: ['version-update:semver-major'] }
    groups:
      dev-tooling: { patterns: ['*'], update-types: [minor, patch] }
